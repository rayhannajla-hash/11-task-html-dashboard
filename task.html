<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task.html — Team Task Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800" x-data="taskApp()" x-init="init()" x-cloak>

<!-- HEADER -->
<header class="bg-slate-900 text-white px-4 py-4 sm:px-8 flex flex-wrap items-center gap-3">
  <h1 class="text-xl font-bold">✅ Task.html</h1>
  <span class="text-slate-400 text-sm hidden sm:inline">Dashboard tugas tim — tanpa install, tanpa server</span>
  <div class="ml-auto flex gap-2">
    <button @click="exportJson()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm">💾 Export</button>
    <label class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm cursor-pointer">📥 Import
      <input type="file" accept=".json" class="hidden" @change="importJson($event)">
    </label>
    <button @click="showSettings=true" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm">⚙️</button>
  </div>
</header>

<main class="max-w-6xl mx-auto p-4 sm:p-6">

  <!-- KPI CARDS -->
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
    <div class="bg-white rounded-xl shadow-sm p-4">
      <div class="text-2xl font-extrabold" x-text="tasks.length"></div>
      <div class="text-xs text-slate-500 mt-1">📊 Total <span x-text="labels.task"></span></div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
      <div class="text-2xl font-extrabold text-green-600" x-text="doneToday"></div>
      <div class="text-xs text-slate-500 mt-1">✅ Selesai hari ini</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
      <div class="text-2xl font-extrabold text-blue-600" x-text="inProgress"></div>
      <div class="text-xs text-slate-500 mt-1">🔄 Dikerjakan</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4" :class="overdue>0 && 'ring-2 ring-red-400'">
      <div class="text-2xl font-extrabold text-red-600" x-text="overdue"></div>
      <div class="text-xs text-slate-500 mt-1">⚠️ Overdue</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4 col-span-2 sm:col-span-1">
      <div class="text-2xl font-extrabold text-indigo-600" x-text="completionRate + '%'"></div>
      <div class="text-xs text-slate-500 mt-1">📈 Completion rate</div>
    </div>
  </div>

  <!-- FILTERS + ADD -->
  <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex flex-wrap items-end gap-3">
    <div>
      <label class="text-xs text-slate-500 block mb-1" x-text="labels.pic"></label>
      <select x-model="filterPic" class="border rounded-lg px-2 py-1.5 text-sm">
        <option value="">Semua</option>
        <template x-for="p in picList" :key="p"><option :value="p" x-text="p"></option></template>
      </select>
    </div>
    <div>
      <label class="text-xs text-slate-500 block mb-1">Status</label>
      <select x-model="filterStatus" class="border rounded-lg px-2 py-1.5 text-sm">
        <option value="">Semua</option>
        <template x-for="s in STATUSES" :key="s"><option :value="s" x-text="s"></option></template>
      </select>
    </div>
    <div>
      <label class="text-xs text-slate-500 block mb-1">Prioritas</label>
      <select x-model="filterPrio" class="border rounded-lg px-2 py-1.5 text-sm">
        <option value="">Semua</option>
        <template x-for="p in PRIORITIES" :key="p"><option :value="p" x-text="p"></option></template>
      </select>
    </div>
    <div>
      <label class="text-xs text-slate-500 block mb-1">Urutkan</label>
      <select x-model="sortBy" class="border rounded-lg px-2 py-1.5 text-sm">
        <option value="deadline">Deadline terdekat</option>
        <option value="priority">Prioritas tertinggi</option>
        <option value="name">Nama (A–Z)</option>
      </select>
    </div>
    <button @click="openAdd()" class="ml-auto bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
      ➕ Tambah <span x-text="labels.task"></span>
    </button>
  </div>

  <!-- TASK LIST -->
  <div class="space-y-2">
    <template x-for="t in filtered" :key="t.id">
      <div class="bg-white rounded-xl shadow-sm p-4 flex flex-wrap items-center gap-3"
           :class="isOverdue(t) && 'border-l-4 border-red-500'">
        <input type="checkbox" :checked="t.status==='Selesai'" @change="toggleDone(t)"
               class="w-5 h-5 accent-green-600 shrink-0">
        <div class="flex-1 min-w-[180px]">
          <div class="font-semibold" :class="t.status==='Selesai' && 'line-through text-slate-400'" x-text="t.name"></div>
          <div class="text-xs text-slate-500 mt-0.5">
            <span x-text="labels.pic + ': ' + (t.pic||'-')"></span> ·
            <span x-text="relDate(t.deadline)" :class="isOverdue(t) ? 'text-red-600 font-semibold':''"></span>
          </div>
        </div>
        <span class="text-xs px-2 py-1 rounded-full font-medium" :class="prioClass(t.priority)" x-text="t.priority"></span>
        <span class="text-xs px-2 py-1 rounded-full font-medium" :class="statusClass(t.status)" x-text="t.status"></span>
        <div class="flex gap-1">
          <button @click="openEdit(t)" class="text-slate-400 hover:text-indigo-600 px-1" title="Edit">✏️</button>
          <button @click="removeTask(t)" class="text-slate-400 hover:text-red-600 px-1" title="Hapus">🗑️</button>
        </div>
      </div>
    </template>
    <div x-show="filtered.length===0" class="text-center text-slate-400 py-12">
      Tidak ada <span x-text="labels.task.toLowerCase()"></span> yang cocok. Klik ➕ untuk menambah.
    </div>
  </div>
</main>

<!-- ADD/EDIT MODAL -->
<div x-show="showForm" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" @click.self="showForm=false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h2 class="font-bold text-lg mb-4" x-text="(form.id ? 'Edit ' : 'Tambah ') + labels.task"></h2>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-slate-500 block mb-1" x-text="'Nama ' + labels.task"></label>
        <input x-model="form.name" class="border rounded-lg px-3 py-2 w-full text-sm" placeholder="Contoh: Desain panel 340x190 rev.B">
      </div>
      <div>
        <label class="text-xs text-slate-500 block mb-1" x-text="labels.pic"></label>
        <input x-model="form.pic" list="picOptions" class="border rounded-lg px-3 py-2 w-full text-sm" placeholder="Nama penanggung jawab">
        <datalist id="picOptions"><template x-for="p in picList" :key="p"><option :value="p"></option></template></datalist>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-500 block mb-1">Prioritas</label>
          <select x-model="form.priority" class="border rounded-lg px-3 py-2 w-full text-sm">
            <template x-for="p in PRIORITIES" :key="p"><option :value="p" x-text="p"></option></template>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-500 block mb-1">Deadline</label>
          <input type="date" x-model="form.deadline" class="border rounded-lg px-3 py-2 w-full text-sm">
        </div>
      </div>
      <div>
        <label class="text-xs text-slate-500 block mb-1">Status</label>
        <select x-model="form.status" class="border rounded-lg px-3 py-2 w-full text-sm">
          <template x-for="s in STATUSES" :key="s"><option :value="s" x-text="s"></option></template>
        </select>
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button @click="saveForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex-1">Simpan</button>
      <button @click="showForm=false" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm">Batal</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL (COLUMN MAPPING) -->
<div x-show="showSettings" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" @click.self="showSettings=false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h2 class="font-bold text-lg mb-1">⚙️ Pengaturan</h2>
    <p class="text-xs text-slate-500 mb-4">Sesuaikan label kolom dengan istilah tim kamu (column mapping).</p>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-slate-500 block mb-1">Label untuk "Task"</label>
        <input x-model="labels.task" class="border rounded-lg px-3 py-2 w-full text-sm" placeholder='Misal: "Desain"'>
      </div>
      <div>
        <label class="text-xs text-slate-500 block mb-1">Label untuk "PIC"</label>
        <input x-model="labels.pic" class="border rounded-lg px-3 py-2 w-full text-sm" placeholder='Misal: "Operator"'>
      </div>
    </div>
    <div class="border-t mt-5 pt-4">
      <button @click="clearAll()" class="text-red-600 text-sm hover:underline">🗑️ Hapus semua data</button>
    </div>
    <div class="flex gap-2 mt-5">
      <button @click="saveSettings()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex-1">Simpan</button>
      <button @click="showSettings=false" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm">Tutup</button>
    </div>
  </div>
</div>

<script>
function taskApp(){
  return {
    STORAGE: "taskhtml_v1",
    STATUSES: ["Belum mulai","Dikerjakan","Review","Selesai"],
    PRIORITIES: ["Tinggi","Sedang","Rendah"],

    tasks: [], labels: {task:"Task", pic:"PIC"},
    filterPic:"", filterStatus:"", filterPrio:"", sortBy:"deadline",
    showForm:false, showSettings:false,
    form: {},

    init(){
      try{
        const saved = JSON.parse(localStorage.getItem(this.STORAGE) || "{}");
        this.tasks  = saved.tasks  || [];
        this.labels = Object.assign(this.labels, saved.labels || {});
      }catch(e){ this.tasks = []; }
      this.$watch("tasks",  ()=>this.persist());
    },

    persist(){
      localStorage.setItem(this.STORAGE, JSON.stringify({tasks:this.tasks, labels:this.labels, exported:null}));
    },

    // ---------- computed ----------
    get picList(){ return [...new Set(this.tasks.map(t=>t.pic).filter(Boolean))].sort(); },
    get doneToday(){
      const today = new Date().toISOString().slice(0,10);
      return this.tasks.filter(t=>t.status==="Selesai" && t.doneAt===today).length;
    },
    get inProgress(){ return this.tasks.filter(t=>t.status==="Dikerjakan"||t.status==="Review").length; },
    get overdue(){ return this.tasks.filter(t=>this.isOverdue(t)).length; },
    get completionRate(){
      if(!this.tasks.length) return 0;
      return Math.round(this.tasks.filter(t=>t.status==="Selesai").length / this.tasks.length * 100);
    },
    get filtered(){
      let list = this.tasks.filter(t=>
        (!this.filterPic    || t.pic===this.filterPic) &&
        (!this.filterStatus || t.status===this.filterStatus) &&
        (!this.filterPrio   || t.priority===this.filterPrio));
      const prioRank = {"Tinggi":0,"Sedang":1,"Rendah":2};
      if(this.sortBy==="deadline")  list.sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999"));
      if(this.sortBy==="priority")  list.sort((a,b)=>prioRank[a.priority]-prioRank[b.priority]);
      if(this.sortBy==="name")      list.sort((a,b)=>a.name.localeCompare(b.name,"id"));
      return list;
    },

    // ---------- helpers ----------
    isOverdue(t){
      return t.deadline && t.status!=="Selesai" && t.deadline < new Date().toISOString().slice(0,10);
    },
    relDate(d){
      if(!d) return "Tanpa deadline";
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((new Date(d) - today) / 86400000);
      if(diff===0)  return "📅 Hari ini";
      if(diff===1)  return "📅 Besok";
      if(diff===-1) return "📅 Kemarin";
      if(diff>1)    return `📅 ${diff} hari lagi`;
      return `📅 ${-diff} hari lewat`;
    },
    prioClass(p){
      return {"Tinggi":"bg-red-100 text-red-700","Sedang":"bg-amber-100 text-amber-700","Rendah":"bg-slate-100 text-slate-600"}[p]||"";
    },
    statusClass(s){
      return {"Belum mulai":"bg-slate-100 text-slate-600","Dikerjakan":"bg-blue-100 text-blue-700",
              "Review":"bg-purple-100 text-purple-700","Selesai":"bg-green-100 text-green-700"}[s]||"";
    },

    // ---------- CRUD ----------
    openAdd(){
      this.form = {id:null, name:"", pic:"", priority:"Sedang", deadline:"", status:"Belum mulai"};
      this.showForm = true;
    },
    openEdit(t){ this.form = {...t}; this.showForm = true; },
    saveForm(){
      if(!this.form.name.trim()){ alert("Nama tidak boleh kosong."); return; }
      if(this.form.id){
        const i = this.tasks.findIndex(t=>t.id===this.form.id);
        if(this.form.status==="Selesai" && this.tasks[i].status!=="Selesai")
          this.form.doneAt = new Date().toISOString().slice(0,10);
        this.tasks.splice(i, 1, {...this.form});
      }else{
        this.form.id = Date.now() + "_" + Math.random().toString(36).slice(2,7);
        if(this.form.status==="Selesai") this.form.doneAt = new Date().toISOString().slice(0,10);
        this.tasks.push({...this.form});
      }
      this.showForm = false;
    },
    toggleDone(t){
      const i = this.tasks.findIndex(x=>x.id===t.id);
      const done = t.status!=="Selesai";
      this.tasks.splice(i,1,{...t, status: done?"Selesai":"Dikerjakan", doneAt: done? new Date().toISOString().slice(0,10):null});
    },
    removeTask(t){
      if(confirm(`Hapus "${t.name}"?`)) this.tasks = this.tasks.filter(x=>x.id!==t.id);
    },
    clearAll(){
      if(confirm("Hapus SEMUA data? Export dulu kalau perlu backup!")){
        this.tasks=[]; this.showSettings=false;
      }
    },
    saveSettings(){ this.persist(); this.showSettings=false; },

    // ---------- import / export ----------
    exportJson(){
      const data = JSON.stringify({app:"task.html", version:1, exported:new Date().toISOString(),
        labels:this.labels, tasks:this.tasks}, null, 2);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data],{type:"application/json"}));
      a.download = "task-export-" + new Date().toISOString().slice(0,10) + ".json";
      a.click();
    },
    importJson(ev){
      const file = ev.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = e=>{
        try{
          const data = JSON.parse(e.target.result);
          if(!Array.isArray(data.tasks)) throw new Error("format tidak dikenali");
          const mode = confirm("OK = GABUNG dengan data sekarang\nCancel = TIMPA semua data");
          if(mode){
            const existing = new Set(this.tasks.map(t=>t.id));
            data.tasks.forEach(t=>{ if(!existing.has(t.id)) this.tasks.push(t); });
          }else{
            this.tasks = data.tasks;
          }
          if(data.labels) this.labels = Object.assign(this.labels, data.labels);
          alert(`Import berhasil: ${data.tasks.length} ${this.labels.task.toLowerCase()} dibaca.`);
        }catch(err){ alert("Import gagal: " + err.message + "\nPastikan file JSON berasal dari Task.html."); }
        ev.target.value = "";
      };
      reader.readAsText(file);
    },
  };
}
</script>
</body>
</html>
